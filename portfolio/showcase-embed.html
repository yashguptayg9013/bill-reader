<!--
  Bill Reader interactive demo: paste this at the top of your website, where
  you want the demo to appear. The frame resizes itself to fit the demo.

  Options (add to the src URL after ?embed):
    &theme=light   or   &theme=dark   force a theme to match your site
                                      (default follows the visitor's system)
-->
<iframe
  id="bill-reader-demo"
  src="https://yashguptayg9013.github.io/bill-reader/?embed"
  title="Bill Reader: interactive demo"
  style="display:block;width:100%;height:960px;border:0;background:transparent"
></iframe>
<script>
  addEventListener("message", function (e) {
    if (e.origin !== "https://yashguptayg9013.github.io") return;
    if (e.data && e.data.type === "bill-reader:height") {
      document.getElementById("bill-reader-demo").style.height = e.data.height + "px";
    }
  });
</script>
